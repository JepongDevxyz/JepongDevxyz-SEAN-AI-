<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.E.A.N. - AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            height: 100dvh;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        .bubble-user {
            background-color: #6366f1;
            color: #ffffff;
            border-top-left-radius: 1.2rem;
            border-top-right-radius: 0.2rem;
            border-bottom-left-radius: 1.2rem;
            border-bottom-right-radius: 1.2rem;
        }
        .bubble-ai {
            background-color: #1e293b;
            color: #f1f5f9;
            border-top-left-radius: 0.2rem;
            border-top-right-radius: 1.2rem;
            border-bottom-left-radius: 1.2rem;
            border-bottom-right-radius: 1.2rem;
            border: 1px solid #334155;
        }
        .recording {
            color: #ef4444 !important;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden antialiased">

    <!-- Header -->
    <header class="bg-[#1e293b]/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex justify-between items-center shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600/20 p-2 rounded-xl border border-indigo-500/30">
                <i class="fa-solid fa-robot text-indigo-400 text-xl"></i>
            </div>
            <span class="font-bold text-lg tracking-wider text-white">S.E.A.N.</span>
        </div>

        <div class="flex items-center space-x-3">
            <div class="bg-slate-800 px-3 py-1 rounded-full text-xs font-mono text-emerald-400 border border-slate-700 flex items-center space-x-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="pingDisplay">-- ms</span>
            </div>
            <button id="menuToggleBtn" class="text-slate-300 hover:text-white p-1 focus:outline-none">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
        </div>
    </header>

    <!-- Sidebar Overlay & Menu -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-30 hidden backdrop-blur-sm"></div>
    <aside id="sidebar" class="fixed top-0 right-0 h-full w-80 bg-[#1e293b] border-l border-slate-800 z-40 transform translate-x-full transition-transform duration-300 ease-in-out p-5 flex flex-col justify-between shadow-2xl">
        <div class="space-y-6">
            <!-- Sidebar Header -->
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <span class="text-xs font-semibold uppercase text-slate-400 tracking-widest">Settings & History</span>
                <button id="closeSidebarBtn" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- Custom Modern Dropdown -->
            <div>
                <label class="block text-[11px] font-semibold text-slate-400 mb-2 uppercase tracking-wider">Select AI Engine</label>
                <div class="relative">
                    <button id="dropdownBtn" onclick="toggleDropdown()" class="w-full bg-slate-900/90 text-slate-200 text-sm rounded-xl border border-slate-700/80 px-3.5 py-2.5 flex items-center justify-between hover:border-indigo-500/50 transition">
                        <span id="selectedProviderText" class="truncate font-medium">Google Gemini 1.5</span>
                        <i class="fa-solid fa-chevron-down text-xs text-slate-400 ml-2"></i>
                    </button>

                    <!-- Dropdown Options Menu -->
                    <div id="dropdownMenu" class="hidden absolute top-full left-0 right-0 mt-2 bg-slate-900 border border-slate-700/80 rounded-xl shadow-2xl z-50 overflow-hidden py-1 max-h-60 overflow-y-auto backdrop-blur-xl">
                        <div onclick="selectProvider('gemini', 'Google Gemini 1.5')" class="provider-option px-3.5 py-2.5 text-xs text-slate-300 hover:bg-indigo-600/20 hover:text-indigo-300 cursor-pointer flex justify-between items-center transition">
                            <span>Gemini 3.6</span>
                            <i class="fa-solid fa-check text-indigo-400 hidden check-icon"></i>
                        </div>
                        <div onclick="selectProvider('huggingface', 'Hugging Face (Qwen 2.5)')" class="provider-option px-3.5 py-2.5 text-xs text-slate-300 hover:bg-indigo-600/20 hover:text-indigo-300 cursor-pointer flex justify-between items-center transition">
                            <span>ChatGPT</span>
                            <i class="fa-solid fa-check text-indigo-400 hidden check-icon"></i>
                        </div>
                        <div onclick="selectProvider('llama', 'Meta Llama (Groq)')" class="provider-option px-3.5 py-2.5 text-xs text-slate-300 hover:bg-indigo-600/20 hover:text-indigo-300 cursor-pointer flex justify-between items-center transition">
                            <span>Llama 4</span>
                            <i class="fa-solid fa-check text-indigo-400 hidden check-icon"></i>
                        </div>
                        
                        <div onclick="selectProvider('mistral', 'Mistral AI')" class="provider-option px-3.5 py-2.5 text-xs text-slate-300 hover:bg-indigo-600/20 hover:text-indigo-300 cursor-pointer flex justify-between items-center transition">
                            <span>Mistral AI</span>
                            <i class="fa-solid fa-check text-indigo-400 hidden check-icon"></i>
                        </div>
                        <div onclick="selectProvider('cohere', 'Cohere (Command R+)')" class="provider-option px-3.5 py-2.5 text-xs text-slate-300 hover:bg-indigo-600/20 hover:text-indigo-300 cursor-pointer flex justify-between items-center transition">
                            <span>Cohere AI</span>
                            <i class="fa-solid fa-check text-indigo-400 hidden check-icon"></i>
                        </div>
                        
                    </div>
                </div>
            </div>

            <!-- New Chat Button -->
            <button onclick="createNewChat()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center space-x-2 transition shadow-lg shadow-indigo-600/20">
                <i class="fa-solid fa-plus text-xs"></i>
                <span class="text-xs">New Conversation</span>
            </button>

            <!-- History List -->
            <div>
                <span class="block text-[11px] font-semibold text-slate-500 mb-2 uppercase tracking-wider">Recent</span>
                <div id="chatHistory" class="space-y-1 overflow-y-auto max-h-[40vh] pr-1"></div>
            </div>
        </div>

        <!-- Minimalist Clear History Link -->
        <div class="border-t border-slate-800/80 pt-3">
            <button onclick="clearAllHistory()" class="text-xs text-slate-500 hover:text-red-400 transition flex items-center space-x-1.5 px-1 py-1">
                <i class="fa-regular fa-trash-can text-xs"></i>
                <span>Clear history</span>
            </button>
        </div>
    </aside>

    <!-- Main Chat Content Container -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full" id="chatContainer">
        <!-- Welcome Screen -->
        <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center px-4 my-auto">
            <div class="w-20 h-20 bg-indigo-600/20 border border-indigo-500/30 rounded-full flex items-center justify-center mb-6 shadow-inner">
                <i class="fa-solid fa-brain text-4xl text-indigo-400"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-3">Kumusta! Ako si S.E.A.N.</h1>
            <p class="text-slate-400 text-sm max-w-sm leading-relaxed">
                Ang iyong AI assistant. Magtanong ng kahit ano, humingi ng tulong sa coding, o lumikha ng mga larawan.
            </p>
        </div>
    </main>

    <!-- Input Footer -->
    <footer class="p-3 md:p-4 bg-[#1e293b] border-t border-slate-800 shrink-0">
        <div class="max-w-4xl mx-auto">
            <div class="bg-slate-900 border border-slate-700/80 rounded-2xl flex items-center px-3 py-2 focus-within:border-indigo-500 transition-all">
                <button class="text-slate-400 hover:text-slate-200 p-2" title="Attach file">
                    <i class="fa-solid fa-paperclip text-lg"></i>
                </button>
                <button id="micBtn" onclick="toggleSpeech()" class="text-slate-400 hover:text-slate-200 p-2" title="Voice Input">
                    <i class="fa-solid fa-microphone text-lg"></i>
                </button>
                <textarea id="userInput" rows="1" placeholder="Mag-type ng mensahe..." class="w-full bg-transparent text-white px-2 focus:outline-none resize-none max-h-24 text-sm md:text-base" onkeydown="handleKeyDown(event)"></textarea>
                <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white p-2.5 rounded-xl ml-1 transition shadow-md shadow-indigo-600/30">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
            <div class="text-center text-[10px] text-slate-500 mt-1.5">
                S.E.A.N. can make mistakes. Verify important information.
            </div>
        </div>
    </footer>

    <script>
        let chatSessions = JSON.parse(localStorage.getItem('sean_sessions') || '{}');
        let currentSessionId = null;
        let selectedProvider = 'gemini';
        let recognition = null;
        let isRecording = false;

        document.addEventListener('DOMContentLoaded', () => {
            setupSidebar();
            setupVoice();
            
            const tx = document.getElementById('userInput');
            tx.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            const keys = Object.keys(chatSessions);
            if (keys.length > 0) loadSession(keys[keys.length - 1]);
            else createNewChat();

            // Close custom dropdown on outside click
            document.addEventListener('click', (e) => {
                const btn = document.getElementById('dropdownBtn');
                const menu = document.getElementById('dropdownMenu');
                if (btn && menu && !btn.contains(e.target) && !menu.contains(e.target)) {
                    menu.classList.add('hidden');
                }
            });
        });

        function toggleDropdown() {
            const menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('hidden');
        }

        function selectProvider(value, label) {
            selectedProvider = value;
            document.getElementById('selectedProviderText').innerText = label;
            document.getElementById('dropdownMenu').classList.add('hidden');
            
            document.querySelectorAll('.provider-option').forEach(el => {
                const check = el.querySelector('.check-icon');
                if (el.innerText.includes(label)) {
                    check.classList.remove('hidden');
                    el.classList.add('bg-indigo-600/20', 'text-indigo-300');
                } else {
                    check.classList.add('hidden');
                    el.classList.remove('bg-indigo-600/20', 'text-indigo-300');
                }
            });
        }

        function setupSidebar() {
            const toggle = document.getElementById('menuToggleBtn');
            const close = document.getElementById('closeSidebarBtn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');

            const openFn = () => { sidebar.classList.remove('translate-x-full'); overlay.classList.remove('hidden'); };
            const closeFn = () => { sidebar.classList.add('translate-x-full'); overlay.classList.add('hidden'); };

            toggle.addEventListener('click', openFn);
            close.addEventListener('click', closeFn);
            overlay.addEventListener('click', closeFn);
        }

        function setupVoice() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'tl-PH';
                recognition.onresult = (e) => {
                    document.getElementById('userInput').value += e.results[0][0].transcript;
                    stopSpeech();
                };
                recognition.onerror = stopSpeech;
                recognition.onend = stopSpeech;
            }
        }

        function toggleSpeech() {
            if (!recognition) return alert('Voice input not supported in browser');
            const mic = document.getElementById('micBtn');
            if (!isRecording) {
                recognition.start();
                isRecording = true;
                mic.classList.add('recording');
            } else {
                recognition.stop();
                stopSpeech();
            }
        }

        function stopSpeech() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
        }

        function createNewChat() {
            currentSessionId = 's_' + Date.now();
            chatSessions[currentSessionId] = { title: 'New Conversation', messages: [] };
            saveSessions();
            renderHistory();
            renderMessages();
        }

        function loadSession(id) {
            currentSessionId = id;
            renderHistory();
            renderMessages();
        }

        function saveSessions() {
            localStorage.setItem('sean_sessions', JSON.stringify(chatSessions));
        }

        function renderHistory() {
            const container = document.getElementById('chatHistory');
            container.innerHTML = '';
            Object.keys(chatSessions).reverse().forEach(id => {
                const s = chatSessions[id];
                const active = id === currentSessionId;
                const div = document.createElement('div');
                div.className = `flex justify-between items-center px-3 py-2 rounded-xl text-xs cursor-pointer transition ${active ? 'bg-indigo-600/20 text-indigo-300 font-medium border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`;
                div.onclick = () => loadSession(id);
                div.innerHTML = `<span class="truncate">${s.title}</span>`;
                container.appendChild(div);
            });
        }

        function renderMessages() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';
            const session = chatSessions[currentSessionId];
            if (!session || session.messages.length === 0) {
                container.innerHTML = `
                    <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center px-4 my-auto">
                        <div class="w-20 h-20 bg-indigo-600/20 border border-indigo-500/30 rounded-full flex items-center justify-center mb-6 shadow-inner">
                            <i class="fa-solid fa-brain text-4xl text-indigo-400"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-white mb-3">Kumusta! Ako si S.E.A.N.</h1>
                        <p class="text-slate-400 text-sm max-w-sm leading-relaxed">
                            Ang iyong AI assistant. Magtanong ng kahit ano, humingi ng tulong sa coding, o lumikha ng mga larawan.
                        </p>
                    </div>`;
                return;
            }

            session.messages.forEach(m => appendBubble(m.role, m.content));
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            const session = chatSessions[currentSessionId];
            if (session.messages.length === 0) {
                session.title = text.substring(0, 20);
                renderHistory();
            }

            session.messages.push({ role: 'user', content: text });
            appendBubble('user', text);

            input.value = '';
            input.style.height = 'auto';

            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;

            await fetchAiResponse();
            saveSessions();
        }

        async function fetchAiResponse() {
            const session = chatSessions[currentSessionId];
            const aiBubble = appendBubble('assistant', '');
            const contentDiv = aiBubble.querySelector('.content-body');

            const startTime = performance.now();
            let accumulatedText = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: session.messages, provider: selectedProvider })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || 'Server responded with an error');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let firstChunk = false;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    if (!firstChunk) {
                        document.getElementById('pingDisplay').innerText = Math.round(performance.now() - startTime) + ' ms';
                        firstChunk = true;
                    }

                    accumulatedText += decoder.decode(value, { stream: true });
                    contentDiv.innerHTML = marked.parse(accumulatedText);
                    document.querySelectorAll('pre code').forEach((el) => hljs.highlightElement(el));
                    document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
                }

                session.messages.push({ role: 'assistant', content: accumulatedText });

            } catch (err) {
                contentDiv.innerHTML = `<span class="text-red-400">Error: Nagkaroon ng problema sa pagproseso ng iyong request. (${err.message})</span>`;
            }
        }

        function appendBubble(role, content) {
            const container = document.getElementById('chatContainer');
            const wrapper = document.createElement('div');
            const isUser = role === 'user';
            
            wrapper.className = `flex items-start space-x-2 mb-4 ${isUser ? 'flex-row-reverse space-x-reverse' : 'flex-row'}`;

            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${isUser ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-indigo-400 border border-slate-700'} text-xs shadow-md">
                    <i class="fa-solid ${isUser ? 'fa-user' : 'fa-robot'}"></i>
                </div>
                <div class="max-w-[80%] p-3.5 text-sm ${isUser ? 'bubble-user' : 'bubble-ai'} shadow-md">
                    <div class="content-body prose prose-invert max-w-none">
                        ${content ? marked.parse(content) : ''}
                    </div>
                </div>
            `;

            container.appendChild(wrapper);
            return wrapper;
        }

        function clearAllHistory() {
            if (confirm('Clear all conversation history?')) {
                chatSessions = {};
                saveSessions();
                createNewChat();
            }
        }
    </script>
</body>
</html>
